name: Build cURL and OpenSSL (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar perl make clang llvm zip autoconf automake libtool

      - name: Download & Prepare Sources
        run: |
          mkdir -p src
          cd src

          # 1. Download OpenSSL
          echo "[+] Mengunduh OpenSSL..."
          wget -q --show-progress https://github.com/openssl/openssl/archive/refs/tags/openssl-4.0.2.tar.gz -O openssl.tar.gz 2>/dev/null || \
          wget -q --show-progress https://github.com/openssl/openssl/releases/download/openssl-4.0.2/openssl-4.0.2.tar.gz -O openssl.tar.gz 2>/dev/null || \
          wget -q --show-progress https://github.com/openssl/openssl/archive/refs/tags/openssl-3.4.0.tar.gz -O openssl.tar.gz

          mkdir -p openssl
          tar -xf openssl.tar.gz -C openssl --strip-components=1

          # 2. Download cURL
          echo "[+] Mengunduh cURL..."
          wget -q --show-progress https://curl.se/download/curl-8.11.1.tar.gz -O curl.tar.gz 2>/dev/null || \
          wget -q --show-progress https://github.com/curl/curl/releases/download/curl-8_11_1/curl-8.11.1.tar.gz -O curl.tar.gz 2>/dev/null || \
          wget -q --show-progress https://github.com/curl/curl/archive/refs/tags/curl-8_22_0.tar.gz -O curl.tar.gz

          mkdir -p curl
          tar -xf curl.tar.gz -C curl --strip-components=1

          # Jika file configure belum ada (source dari git tag), jalankan buildconf
          if [ ! -f "curl/configure" ]; then
            echo "[+] Menjalankan buildconf untuk membangkitkan configure..."
            cd curl && ./buildconf && cd ..
          fi

      - name: Compile OpenSSL (openssl-android-arm64-v8a)
        run: |
          export TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          export API=21
          export TARGET=aarch64-linux-android
          export CC="$TOOLCHAIN/bin/${TARGET}${API}-clang"
          export CXX="$TOOLCHAIN/bin/${TARGET}${API}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export AS="$CC"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export PATH="$TOOLCHAIN/bin:$PATH"

          PREFIX_OPENSSL="$GITHUB_WORKSPACE/output/openssl-android-arm64-v8a"
          mkdir -p "$PREFIX_OPENSSL"

          cd src/openssl
          ./Configure android-arm64 \
            -D__ANDROID_API__=$API \
            no-shared \
            no-unit-test \
            no-tests \
            --prefix="$PREFIX_OPENSSL" \
            --openssldir="$PREFIX_OPENSSL"

          make -j$(nproc)
          make install_sw

          # Rapikan folder lib jika OpenSSL menempatkannya di lib64
          if [ -d "$PREFIX_OPENSSL/lib64" ] && [ ! -d "$PREFIX_OPENSSL/lib" ]; then
            ln -s lib64 "$PREFIX_OPENSSL/lib"
          fi

      - name: Compile cURL (curl-android-arm64-v8a)
        run: |
          export TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          export API=21
          export TARGET=aarch64-linux-android
          export CC="$TOOLCHAIN/bin/${TARGET}${API}-clang"
          export CXX="$TOOLCHAIN/bin/${TARGET}${API}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export AS="$CC"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export PATH="$TOOLCHAIN/bin:$PATH"

          PREFIX_CURL="$GITHUB_WORKSPACE/output/curl-android-arm64-v8a"
          PREFIX_OPENSSL="$GITHUB_WORKSPACE/output/openssl-android-arm64-v8a"
          mkdir -p "$PREFIX_CURL"

          cd src/curl
          ./configure \
            --host=aarch64-linux-android \
            --target=aarch64-linux-android \
            --prefix="$PREFIX_CURL" \
            --with-openssl="$PREFIX_OPENSSL" \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-curldebug \
            --disable-manual \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smtp \
            --disable-gopher \
            --disable-sspi \
            --without-libidn2 \
            --without-nghttp2 \
            CFLAGS="-fPIE -fPIC" \
            LDFLAGS="-pie"

          make -j$(nproc)
          make install

      - name: Create Release Archive
        run: |
          cd $GITHUB_WORKSPACE/output
          zip -r $GITHUB_WORKSPACE/curl-openssl-android-arm64-v8a.zip curl-android-arm64-v8a openssl-android-arm64-v8a

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-openssl-android-arm64-v8a
          path: curl-openssl-android-arm64-v8a.zip
